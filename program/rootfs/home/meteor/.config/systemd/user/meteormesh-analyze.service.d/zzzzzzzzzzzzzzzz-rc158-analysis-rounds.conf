[Unit]
OnSuccess=
# Install as a drop-in for meteormesh-analyze.service after the active run exits.
[Service]
Environment=METEORMESH_HUB_PATH=/home/meteor/.local/share/meteormesh/releases/rc158-20261103-analysis-rounds/MeteorHub
ExecCondition=/bin/sh -c 'for unit in meteormesh-hourly-pull.service meteormesh-midnight.service meteormesh-morning.service; do state=$(/usr/bin/systemctl --user show "$unit" -p ActiveState --value 2>/dev/null) || exit 1; case "$state" in inactive|failed) :;; *) exit 1;; esac; done; /usr/bin/flock --nonblock /srv/meteor-data/.meteor-morning.lock /usr/bin/true'
ExecCondition=/usr/bin/python3 -B /home/meteor/.local/share/meteormesh/releases/rc158-20261103-analysis-rounds/ops/meteor-analysis-queue-guard.py
WorkingDirectory=/home/meteor/.local/share/meteormesh/releases/rc158-20261103-analysis-rounds/MeteorHub
ExecStart=
ExecStart=/usr/bin/python3 -B /home/meteor/.local/share/meteormesh/releases/rc158-20261103-analysis-rounds/MeteorHub/meteor_morning.py run --config /home/meteor/.config/meteormesh/devices-three-lab-rc12.json --night-scope /home/meteor/.local/share/meteormesh/staging/fullnight/night-scope-current.json --data-dir /srv/meteor-data --metdet-repo /opt/meteormesh/MetDetPy --metdet-config /opt/meteormesh/MetDetPy/config/m3det_normal.json --max-jobs 5 --max-runtime-hours 16 --detector-timeout-seconds 1800 --min-free-gb 100 --phase analyze
