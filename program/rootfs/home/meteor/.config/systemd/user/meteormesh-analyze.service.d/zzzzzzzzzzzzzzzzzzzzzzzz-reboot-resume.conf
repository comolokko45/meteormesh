[Unit]
StartLimitIntervalSec=2h
StartLimitBurst=4

[Service]
Restart=on-abnormal
RestartSec=2min
ExecStartPre=/usr/bin/python3 -B /home/meteor/.local/lib/meteormesh/meteor-network-ready.py --timeout 300
Environment=METEORMESH_HUB_PATH=/home/meteor/.local/share/meteormesh/releases/rc159-20261103-reboot-resume/MeteorHub
WorkingDirectory=/home/meteor/.local/share/meteormesh/releases/rc159-20261103-reboot-resume/MeteorHub
ExecStart=
ExecStart=/usr/bin/python3 -B /home/meteor/.local/share/meteormesh/releases/rc159-20261103-reboot-resume/MeteorHub/meteor_morning.py run --config /home/meteor/.config/meteormesh/devices-three-lab-rc12.json --night-scope /home/meteor/.local/share/meteormesh/staging/fullnight/night-scope-current.json --data-dir /srv/meteor-data --metdet-repo /opt/meteormesh/MetDetPy --metdet-config /opt/meteormesh/MetDetPy/config/m3det_normal.json --max-jobs 5 --max-runtime-hours 16 --detector-timeout-seconds 1800 --min-free-gb 100 --phase analyze
