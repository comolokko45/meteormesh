name: MeteorNode 0.13.2 PIN0000 — build validation

on:
  push:
    branches: [meteornode-0.13.2-pin0000-test]
    paths:
      - ".github/workflows/build-meteornode0132.yml"
      - "staging/MeteorNode-0.13.2-PIN0000-source.zip.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore pinned source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d staging/MeteorNode-0.13.2-PIN0000-source.zip.b64 > /tmp/meteornode0132.zip
          unzip -t /tmp/meteornode0132.zip | tail -1
          unzip -q /tmp/meteornode0132.zip
          test -f MeteorNode-0.13.2-PIN0000-source/app/build.gradle.kts
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source contract tests
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Build debug APK (not an approved upgrade)
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: gradle --no-daemon :app:assembleDebug
      - name: Record build SHA-256
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "org.meteormesh.node.compactfixedtest"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/meteor0132-sha256.txt
      - name: Upgrade signing compatibility audit (read-only, no install)
        working-directory: MeteorNode-0.13.2-PIN0000-source
        shell: bash
        run: |
          set -euo pipefail
          OLD_APK="$GITHUB_WORKSPACE/releases/MeteorNode-0.12-SingleCopy-debug.apk"
          NEW_APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          REPORT=/tmp/meteor0132-upgrade-audit.txt
          test -s "$OLD_APK"
          test -s "$NEW_APK"
          pkg_line() { "$AAPT" dump badging "$1" | grep -m1 '^package:'; }
          pkg_name() { pkg_line "$1" | awk -F "'" '{print $2}'; }
          version_code() { pkg_line "$1" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p"; }
          cert_sha256() { "$APKSIGNER" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest:/ {print $6; exit}'; }
          old_pkg="$(pkg_name "$OLD_APK")"
          new_pkg="$(pkg_name "$NEW_APK")"
          old_ver="$(version_code "$OLD_APK")"
          new_ver="$(version_code "$NEW_APK")"
          old_cert="$(cert_sha256 "$OLD_APK")"
          new_cert="$(cert_sha256 "$NEW_APK")"
          test -n "$old_pkg" && test -n "$new_pkg" && test -n "$old_ver" && test -n "$new_ver"
          test -n "$old_cert" && test -n "$new_cert"
          {
            echo "REFERENCE: repository MeteorNode-0.12-SingleCopy-debug.apk (NOT a device certificate)"
            echo "old_package=$old_pkg"
            echo "new_package=$new_pkg"
            echo "old_versionCode=$old_ver"
            echo "new_versionCode=$new_ver"
            echo "old_signer_sha256=$old_cert"
            echo "new_signer_sha256=$new_cert"
            sha256sum "$OLD_APK" "$NEW_APK"
          } | tee "$REPORT"
          if [[ "$old_pkg" == "$new_pkg" && "$old_pkg" == 'org.meteormesh.node.compactfixedtest' && "$old_ver" =~ ^[0-9]+$ && "$new_ver" =~ ^[0-9]+$ ]] && (( 10#$new_ver > 10#$old_ver )) && [[ "$old_cert" == "$new_cert" ]]; then
            echo "REFERENCE_UPGRADE_CHECK=PASS" | tee -a "$REPORT"
            echo "Verify the certificate of the APK actually installed on each phone before upgrading." | tee -a "$REPORT"
          else
            echo "REFERENCE_UPGRADE_CHECK=BLOCKED" | tee -a "$REPORT"
            echo "::warning::Do not install over MeteorNode 0.12: reference package, versionCode, or signer is incompatible."
            echo "This APK is suitable for a fresh install after intentional uninstall; uninstall deletes app-private MP4 files." | tee -a "$REPORT"
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish direct single APK (fresh-install only)
        if: github.ref == 'refs/heads/meteornode-0.13.2-pin0000-test'
        shell: bash
        run: |
          set -euo pipefail
          SRC="MeteorNode-0.13.2-PIN0000-source/app/build/outputs/apk/debug/app-debug.apk"
          DEST="releases/MeteorNode-0.13.2-PIN0000-debug.apk"
          test -s "$SRC"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -m1 "^package:")"
          [[ "$BADGING" == *"name='org.meteormesh.node.compactfixedtest'"* ]]
          [[ "$BADGING" == *"versionCode='15'"* ]]
          [[ "$BADGING" == *"versionName='0.13.2-pin0000-alpha'"* ]]
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$SRC"
          mkdir -p releases
          cp "$SRC" "$DEST"
          ( cd releases && sha256sum "$(basename "$DEST")" > MeteorNode-0.13.2-PIN0000-debug.apk.sha256 )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST" "$DEST.sha256"
          if git diff --cached --quiet; then
            echo "Single APK unchanged; no publish commit."
          else
            git commit -m "build: publish MeteorNode 0.13.2 single APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Direct APK: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${DEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Fresh install only. Uninstalling old MeteorNode deletes its app-private data." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorNode-0.13.2-PIN0000-SINGLE-APP-debug
          path: |
            MeteorNode-0.13.2-PIN0000-source/app/build/outputs/apk/debug/app-debug.apk
            /tmp/meteor0132-sha256.txt
            /tmp/meteor0132-upgrade-audit.txt
          if-no-files-found: error

