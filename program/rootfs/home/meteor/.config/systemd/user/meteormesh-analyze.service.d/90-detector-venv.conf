[Service]
Environment=METEORMESH_DETECTOR_PYTHON=/opt/meteormesh/venv-metdetpy/bin/python
Environment=METEORMESH_DETECTOR_CPU_MODE=1
ExecStart=
ExecStart=/opt/meteormesh/venv-metdetpy/bin/python -B /home/meteor/.local/share/meteormesh/releases/rc152-20261101-bounded-retry/MeteorHub/meteor_morning.py run --config /home/meteor/.config/meteormesh/devices-three-lab-rc12.json --night-scope /home/meteor/.local/share/meteormesh/staging/fullnight/night-scope-current.json --data-dir /srv/meteor-data --metdet-repo /opt/meteormesh/MetDetPy --metdet-config /opt/meteormesh/MetDetPy/config/m3det_normal.json --max-jobs 500 --max-runtime-hours 16 --detector-timeout-seconds 1800 --min-free-gb 100 --phase analyze
