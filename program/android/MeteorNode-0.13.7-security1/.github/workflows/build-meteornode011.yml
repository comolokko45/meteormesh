name: MeteorNode 0.11 Remote Storage APK
on:
  push:
    branches: ['meteornode-0.11-remote-storage']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Offline source and Linux client tests
        run: |
          python3 -m unittest discover -s . -p test_v011_storage_contract.py -v
          python3 -m unittest discover -s linux -p 'test_*.py' -v
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorNode-0.11-RemoteStorage-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
