[Service]
ExecCondition=
ExecCondition=/bin/sh -c 'for unit in meteormesh-hourly-pull.service meteormesh-midnight.service meteormesh-morning.service; do state=$(/usr/bin/systemctl --user show "$unit" -p ActiveState --value 2>/dev/null) || exit 1; case "$state" in inactive|failed) :;; *) exit 1;; esac; done; /usr/bin/flock --nonblock /srv/meteor-data/.meteor-morning.lock /usr/bin/true'
ExecCondition=/usr/bin/python3 -B /home/meteor/.local/share/meteormesh/releases/rc158-20261103-analysis-rounds/ops/meteor-analysis-queue-guard.py
ExecCondition=/usr/bin/python3 -B /home/meteor/.local/share/meteormesh/releases/rc188a-analysis-source-backup-20261105/ops/meteor-analysis-source-ready.py --data-dir /srv/meteor-data --night-scope /home/meteor/.local/share/meteormesh/staging/fullnight/night-scope-current.json --hub /home/meteor/.local/share/meteormesh/releases/rc185-no-candidate-retention-20261104/MeteorHub
ExecStopPost=
ExecStopPost=/usr/bin/python3 -B /home/meteor/.local/share/meteormesh/releases/rc188a-analysis-source-backup-20261105/ops/post-analysis-condition-gate.py
