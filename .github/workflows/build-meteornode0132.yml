name: MeteorNode 0.13.2 PIN0000 — build validation

on:
  push:
    branches: [meteornode-0.13.2-pin0000-test]
    paths:
      - ".github/workflows/build-meteornode0132.yml"
      - "staging/MeteorNode-0.13.2-PIN0000-source.zip.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore pinned source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d staging/MeteorNode-0.13.2-PIN0000-source.zip.b64 > /tmp/meteornode0132.zip
          unzip -t /tmp/meteornode0132.zip | tail -1
          unzip -q /tmp/meteornode0132.zip
          test -f MeteorNode-0.13.2-PIN0000-source/app/build.gradle.kts
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source contract tests
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Build debug APK (not an approved upgrade)
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: gradle --no-daemon :app:assembleDebug
      - name: Record build SHA-256
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/meteor0132-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorNode-0.13.2-PIN0000-UNVERIFIED-DEBUG
          path: |
            MeteorNode-0.13.2-PIN0000-source/app/build/outputs/apk/debug/app-debug.apk
            /tmp/meteor0132-sha256.txt
          if-no-files-found: error

      - name: Prepare isolated test package (port 8081)
        working-directory: MeteorNode-0.13.2-PIN0000-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            ('app/build.gradle.kts', 'applicationId = "org.meteormesh.node.compactfixedtest"', 'applicationId = "org.meteormesh.node.pin0000test8081"'),
            ('app/src/main/java/org/meteormesh/node/LocalHttpServer.kt', 'const val PORT = 8080', 'const val PORT = 8081'),
            ('app/src/main/java/org/meteormesh/node/MeteorLanService.kt', 'HTTP 8080', 'HTTP 8081'),
            ('app/src/main/AndroidManifest.xml', 'android:label="MeteorNode 0.13 PIN0000"', 'android:label="MeteorNode 0.13 SAFE TEST"'),
          ]
          for name, old, new in paths:
            p = Path(name)
            s = p.read_text()
            assert s.count(old) == 1, name
            p.write_text(s.replace(old, new))
          PY
      - name: Assemble isolated test APK
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: gradle --no-daemon :app:assembleDebug
      - name: Check isolated package ID
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='org.meteormesh.node.pin0000test8081'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorNode-0.13.2-PIN0000-independent-port8081-debug
          path: MeteorNode-0.13.2-PIN0000-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
