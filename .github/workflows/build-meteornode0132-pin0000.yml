name: MeteorNode 0.13.2 PIN0000 isolated test APK
on:
  push:
    branches: [meteornode-0.13.2-pin0000-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and restore source
        shell: bash
        run: |
          base64 -d staging/MeteorNode-0.13.2-PIN0000-source.zip.b64 > /tmp/meteor0132.zip
          echo '545192d58e94c95e92d02172140ed818f256be4aff6b03dbba0b025808ab32c5  /tmp/meteor0132.zip' | sha256sum -c -
          unzip -q /tmp/meteor0132.zip
      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source and compatibility tests
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: |
          python3 -m unittest discover -s . -p 'test_*.py' -v
          python3 -m unittest discover -s linux -p 'test_*.py' -v
      - name: Convert to safe side-by-side test identity
        working-directory: MeteorNode-0.13.2-PIN0000-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('app/build.gradle.kts')
          text=gradle.read_text()
          old='applicationId = "org.meteormesh.node.compactfixedtest"'
          assert text.count(old)==1
          text=text.replace(old,'applicationId = "org.meteormesh.node.pin0000test"')
          gradle.write_text(text)
          manifest=Path('app/src/main/AndroidManifest.xml')
          xml=manifest.read_text()
          old='android:label="MeteorNode 0.13 PIN0000"'
          assert xml.count(old)==1
          manifest.write_text(xml.replace(old,'android:label="MeteorNode 0.13 TEST"'))
          PY
      - name: Build isolated test APK
        working-directory: MeteorNode-0.13.2-PIN0000-source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify package name and hash
        working-directory: MeteorNode-0.13.2-PIN0000-source
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m 1 "package: name='org.meteormesh.node.pin0000test'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorNode-0132-PIN0000-ISOLATED-test-apk
          path: MeteorNode-0.13.2-PIN0000-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct test APK
        shell: bash
        run: |
          mkdir -p releases
          cp MeteorNode-0.13.2-PIN0000-source/app/build/outputs/apk/debug/app-debug.apk releases/MeteorNode-0.13.2-PIN0000-ISOLATED-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/MeteorNode-0.13.2-PIN0000-ISOLATED-debug.apk
          git commit -m 'build: MeteorNode 0.13.2 isolated test APK [skip ci]'
          git push origin HEAD:meteornode-0.13.2-pin0000-test
